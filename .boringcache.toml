workspace = "boringcache/benchmark-qdrant"

[adapters.docker]
tag = "qdrant-docker-local"
metadata-hints = ["benchmark=qdrant", "upstream-job=integration-tests-build"]
command = [
  "docker", "buildx", "build",
  "--file", "upstream/Dockerfile",
  "--build-arg", "PROFILE=ci",
  "--build-arg", "FEATURES=data-consistency-check,staging",
  "--load",
  "--tag", "qdrant/qdrant:e2e-tests",
  "upstream",
]
