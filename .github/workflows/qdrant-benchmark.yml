name: "Qdrant Docker Benchmark"
run-name: >-
  ${{ format('Benchmark {0} | {1}', (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.cache_lane == 'rolling')) && 'Rolling' || 'Fresh', github.event_name == 'push' && 'Upstream update' || github.event_name == 'schedule' && 'Weekly' || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      cache_lane:
        description: "Benchmark lane"
        required: false
        type: choice
        default: fresh
        options: [fresh, rolling]
      buildkit_image:
        description: "Optional managed BoringCache BuildKit image."
        required: false
        type: string
        default: ""
      cli_version:
        description: "Optional BoringCache CLI release tag."
        required: false
        type: string
        default: ""
      benchmark_id_suffix:
        description: "Optional suffix for isolated comparison runs."
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths: [".gitmodules", "upstream"]
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  benchmark:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: GHA
            strategy: actions-cache
          - label: BoringCache
            strategy: boringcache
    uses: ./.github/workflows/reusable-docker-buildkit-benchmark.yml
    with:
      strategy: ${{ matrix.strategy }}
      cache_lane: ${{ github.event_name == 'push' && 'rolling' || github.event_name == 'workflow_dispatch' && inputs.cache_lane || 'fresh' }}
      benchmark_id: ${{ format('qdrant{0}', inputs.benchmark_id_suffix) }}
      project_repo: qdrant/qdrant
      dockerfile_path: upstream/Dockerfile
      docker_context: upstream
      docker_build_args: |
        --build-arg
        PROFILE=ci
        --build-arg
        FEATURES=data-consistency-check,staging
      image_tag: qdrant-benchmark:latest
      cli_platform: linux-amd64
      cli_version: ${{ inputs.cli_version }}
      buildkit_image: ${{ matrix.strategy == 'boringcache' && (inputs.buildkit_image || 'ghcr.io/boringcache/buildkit@sha256:9b44a5426d7e32db41584c8d7d9f5251b0ad8348427e15849b541418030e7dab') || 'mirror.gcr.io/moby/buildkit:buildx-stable-1' }}
      benchmark_workspace: ${{ github.repository }}
    secrets: inherit
