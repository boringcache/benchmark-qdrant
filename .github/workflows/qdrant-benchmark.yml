name: "Qdrant Docker Benchmark"
run-name: >-
  ${{ format('Benchmark {0} | {1}', (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.cache_lane == 'rolling')) && 'Rolling' || 'Fresh', github.event_name == 'push' && 'Upstream update' || github.event_name == 'schedule' && 'Weekly' || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      cache_lane:
        description: "Benchmark lane"
        required: false
        type: choice
        default: fresh
        options: [fresh, rolling]
      buildkit_image:
        description: "Optional managed BoringCache BuildKit image."
        required: false
        type: string
        default: ""
      cli_version:
        description: "Optional BoringCache CLI release tag."
        required: false
        type: string
        default: ""
      benchmark_id_suffix:
        description: "Optional suffix for isolated comparison runs."
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths: [".gitmodules", "upstream"]
  pull_request:
    paths:
      - ".boringcache.toml"
      - ".gitmodules"
      - ".github/workflows/qdrant-benchmark.yml"
      - ".github/workflows/reusable-qdrant-docker-benchmark.yml"
      - "scripts/prepare-source.sh"
      - "scripts/scope-boringcache-run.sh"
      - "upstream"
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  benchmark:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: GHA
            strategy: actions-cache
          - label: BoringCache
            strategy: boringcache
    uses: ./.github/workflows/reusable-qdrant-docker-benchmark.yml
    with:
      strategy: ${{ matrix.strategy }}
      cache_lane: ${{ github.event_name == 'push' && 'rolling' || github.event_name == 'workflow_dispatch' && inputs.cache_lane || 'fresh' }}
      benchmark_id: ${{ format('qdrant{0}', inputs.benchmark_id_suffix) }}
      cli_version: ${{ inputs.cli_version }}
      buildkit_image: ${{ inputs.buildkit_image }}
    secrets: inherit
